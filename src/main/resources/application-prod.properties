# ============================================
# PRODUCTION PROFILE
# ============================================

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

api.security.token.secret=${API_SECURITY_TOKEN_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

logging.level.root=WARN
logging.level.com.yourpackage=INFO
logging.file.name=/var/log/mtg-deck-builder/application.log

app.email.from=${APP_EMAIL_FROM}
app.frontend.url=${APP_FRONTEND_URL}
app.name=${APP_NAME}
app.email.verification.expiry.hours=${APP_EMAIL_VERIFICATION_EXPIRY_HOURS}
mail.host=${MAIL_HOST}
mail.port=${MAIL_PORT}
mail.username=${MAIL_USERNAME}
mail.password=${MAIL_PASSWORD}
mail.auth=${MAIL_AUTH}
mail.starttls=${MAIL_STARTTLS}
mail.debug=false
password.reset.token.expiry.hours=${PASSWORD_RESET_TOKEN_EXPIRY_HOURS}
password.reset.cleanup.cron=${PASSWORD_RESET_CLEANUP_CRON}