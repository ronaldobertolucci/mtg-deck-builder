# ============================================
# TEST PROFILE
# ============================================
# Database (H2 in-memory para testes)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway (habilitado para criar schema e inserir roles)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

# Security - Token simplificado para testes
api.security.token.secret=test-secret-key

# CORS - Desabilitar em testes
cors.allowed-origins=*

# Logging - Minimal nos testes
logging.level.root=WARN
logging.level.com.yourpackage=INFO

spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Email reset
app.email.from=test@localhost
app.frontend.url=http://localhost:4200
app.name=MTG-Deck-Builder-TEST
app.email.verification.expiry.hours=24
mail.host=localhost
mail.port=1025
mail.username=
mail.password=
mail.auth=false
mail.starttls=false
mail.debug=false
password.reset.token.expiry.hours=1
password.reset.cleanup.cron=-