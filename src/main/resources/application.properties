spring.application.name=mtg-deck-builder

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# ============================================
# DATABASE CONFIGURATION
# ============================================
# Nota: Credenciais devem ser definidas por profile
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# FLYWAY MIGRATION
# ============================================
spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.table=flyway_schema_history
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ============================================
# SECURITY & JWT
# ============================================
api.security.token.issuer=MTG Deck Builder API
api.security.token.expiration-hours=2

# ============================================
# CORS CONFIGURATION
# ============================================
# Nota: Origins permitidas devem ser definidas por profile

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.yourpackage=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n